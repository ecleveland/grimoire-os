name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install shared deps (prepare builds dist)
        working-directory: shared
        run: npm ci
      # npm ci runs the backend's postinstall, which generates the Prisma client.
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      # prettier.spec.ts in the backend suite runs `npm run format:check`
      # inside frontend/, so the frontend toolchain must be installed too.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: backend
        run: npm run lint:check
      - name: Unit tests + coverage thresholds
        working-directory: backend
        run: npm run test:cov
      - name: Production build (nest build)
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            frontend/package-lock.json
      - name: Install shared deps (prepare builds dist)
        working-directory: shared
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck (specs included)
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests + coverage thresholds
        working-directory: frontend
        run: npm run test:cov
      - name: Production build (next build)
        working-directory: frontend
        run: npm run build

  scripts:
    name: SRD extraction lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/*.test.mjs scripts/lib/*.test.mjs
      - name: Test e2e stack naming rules
        run: bash e2e/stack-env.test.sh

  backend-db:
    name: Backend — seed DB regression tests
    runs-on: ubuntu-latest
    # Real-DB seed idempotency tests (VEG-484) need Postgres, which the coverage-
    # gated Backend job deliberately runs without. Its own service container +
    # dedicated database keep it isolated from the Playwright e2e database.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: grimoire
          POSTGRES_PASSWORD: grimoire
          POSTGRES_DB: grimoire_os_seedtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grimoire"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-db-secret
      TEST_DATABASE_URL: postgresql://grimoire:grimoire@localhost:5432/grimoire_os_seedtest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
      - name: Install shared deps (prepare builds dist)
        working-directory: shared
        run: npm ci
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      # global-setup provisions + migrates grimoire_os_seedtest; the service
      # container already created the empty database.
      - name: Seed idempotency (real DB) tests
        working-directory: backend
        run: npm run test:db

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-e2e-secret
      # Compose needs it on every call, exec included, and the e2e specs read
      # it from .env.
      POSTGRES_PASSWORD: grimoire
      E2E_DATABASE_URL: postgresql://grimoire:grimoire@localhost:5432/grimoire_os_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      # dev-e2e.sh waits on the backend port with `nc`, which is not
      # preinstalled on ubuntu-latest runners.
      - name: Install netcat
        run: sudo apt-get update -q && sudo apt-get install -y -q netcat-openbsd
      # dev-e2e.sh sources the repo-root .env (set -e: it must exist).
      - name: Create .env
        run: |
          echo "JWT_SECRET=${JWT_SECRET}" > .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
      - name: Install shared deps (prepare builds dist)
        working-directory: shared
        run: npm ci
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Pre-provision the database before Playwright's webServer launches
      # dev-e2e.sh, so the cold-start work (image pull, migrate, seed) happens
      # in visible, individually-timed steps; dev-e2e.sh then re-runs the same
      # steps as fast idempotent no-ops.
      # docker-compose.dev.yml publishes 5432 for the backend on the runner.
      - name: Start postgres
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres
          # Probe over TCP, not the default unix socket: on a cold volume,
          # initdb's temporary bootstrap server answers socket probes, so a
          # socket pg_isready can pass and the next psql then lands in the
          # bootstrap-restart window ("server closed the connection
          # unexpectedly"). The bootstrap server never binds TCP.
          until docker compose exec postgres pg_isready -h 127.0.0.1 -U grimoire -d grimoire_os; do sleep 1; done
      - name: Provision E2E database
        run: |
          DB_EXISTS=$(docker compose exec -T postgres psql -U grimoire -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'grimoire_os_e2e'")
          if [ "$DB_EXISTS" != "1" ]; then
            docker compose exec -T postgres createdb -U grimoire grimoire_os_e2e
          fi
      - name: Migrate + seed E2E database
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: |
          npx prisma migrate deploy
          npm run seed
      - name: Run Playwright suite
        working-directory: e2e
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  docker:
    name: Docker images build + boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-docker-build
      POSTGRES_PASSWORD: ci-docker-pw
      PUBLIC_URL: http://localhost:3000
      COMPOSE_PROJECT_NAME: ci-smoke
      # The backend runtime image size in MB (10^6 bytes) that the size step
      # prints on the GitHub runner. The step fails above this plus 10 percent.
      # Local Docker Desktop reports a larger number for the same image, so do
      # not set this from a local measurement. To update it, copy the printed
      # value from a passing run of this job.
      BACKEND_IMAGE_BASELINE_MB: 101
    steps:
      - uses: actions/checkout@v7
      # Every push to main runs the whole job. A pull request runs it only when
      # it touches a file that can break the image without breaking the unit
      # suites (VEG-570: a missing tsconfig.build.json shipped a backend image
      # that exited with MODULE_NOT_FOUND while CI stayed green).
      # The cookie files, the auth controller and its DTOs are listed because
      # the Set-Cookie steps below register, log in and count the cookies, and
      # they are the only end-to-end check of the Secure flag. The middleware,
      # the API base and the trust proxy setup are listed because every probe
      # below reaches the backend through the frontend container's /api proxy.
      # The backend lockfile sets what the image installs, the migrate service
      # applies backend/prisma, and logging.config shapes the request lines the
      # log step reads. The seed service runs the compiled backend/src/seed
      # against docs/extracted-srd-json, and .dockerignore decides whether that
      # JSON reaches the image, so a change to any of them can leave the stack
      # with an empty SRD while the unit suites pass.
      - name: Decide whether to run
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only)
          if echo "$files" | grep -qE '^(backend/Dockerfile|frontend/Dockerfile|docker-compose\.yml|docker-compose\.dev\.yml|scripts/compose-config\.test\.sh|(backend|frontend)/tsconfig[^/]*\.json|(backend|frontend)/package\.json|backend/package-lock\.json|backend/prisma/.*|frontend/next\.config\.ts|frontend/src/middleware\.ts|frontend/src/lib/api-base\.ts|backend/prisma\.config\.ts|backend/src/config/(cookie\.config|trust-proxy\.config|logging\.config|configuration)\.ts|backend/src/auth/(auth|csrf)-cookie\.config\.ts|backend/src/auth/auth\.controller\.ts|backend/src/auth/dto/[^/]+\.ts|backend/src/bootstrap-config\.ts|backend/src/main\.ts|backend/src/seed/.*|docs/extracted-srd-json/.*|\.dockerignore|\.github/workflows/ci\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No image-affecting files changed; skipping the Docker build and boot."
          fi
      - name: Validate compose config
        if: steps.changed.outputs.run == 'true'
        run: |
          docker compose config -q
          bash scripts/compose-config.test.sh
      - name: Build images
        if: steps.changed.outputs.run == 'true'
        run: docker compose build
      # Only the runtime image is gated. The migrate image carries the Prisma
      # CLI, and its size is printed for reference.
      - name: Backend image stays within 10 percent of its recorded size
        if: steps.changed.outputs.run == 'true'
        run: |
          migrate_bytes=$(docker image inspect "${COMPOSE_PROJECT_NAME}-migrate" --format '{{.Size}}')
          echo "migrate image: $migrate_bytes bytes, $((migrate_bytes / 1000000)) MB (not gated)"
          bytes=$(docker image inspect "${COMPOSE_PROJECT_NAME}-backend" --format '{{.Size}}')
          mb=$((bytes / 1000000))
          limit=$((BACKEND_IMAGE_BASELINE_MB * 110 / 100))
          echo "backend image: $bytes bytes, $mb MB (baseline $BACKEND_IMAGE_BASELINE_MB MB, limit $limit MB)"
          if [ "$mb" -gt "$limit" ]; then
            echo "::error::The backend image is $mb MB, over the $limit MB limit. Find what grew, or raise BACKEND_IMAGE_BASELINE_MB if the growth is intended."
            exit 1
          fi
      # --wait exits non-zero when any service misses its healthcheck or the
      # migrate or seed service exits non-zero. The timeout covers the
      # migrations, the first seed, the backend's 60 s start_period plus five
      # 10 s retries, then the frontend's 30 s start_period plus five retries.
      # The first seed takes about 3 s on a laptop, and the extra 60 s leaves
      # room for a slow runner.
      - name: Boot the stack and wait for every service to report healthy
        if: steps.changed.outputs.run == 'true'
        run: docker compose up -d --wait --wait-timeout 300
      # The backend depends on migrate with service_completed_successfully, so
      # migrate must have exited 0 before the backend container started. Docker
      # trims trailing zeros from the fractional seconds, so the timestamps are
      # compared as dates and not as strings.
      - name: Migrations ran once and finished before the backend started
        if: steps.changed.outputs.run == 'true'
        run: |
          docker compose ps -a migrate backend
          migrate=$(docker compose ps -a -q migrate)
          backend=$(docker compose ps -a -q backend)
          state=$(docker inspect "$migrate" --format '{{.State.Status}} {{.State.ExitCode}} {{.RestartCount}}')
          echo "migrate status, exit code, restarts: $state"
          [ "$state" = "exited 0 0" ]
          finished=$(docker inspect "$migrate" --format '{{.State.FinishedAt}}')
          started=$(docker inspect "$backend" --format '{{.State.StartedAt}}')
          echo "migrate finished $finished, backend started $started"
          node -e 'const [finished, started] = process.argv.slice(1).map(Date.parse); process.exit(finished < started ? 0 : 1)' "$finished" "$started"
          # The database is fresh, so Prisma applies every migration.
          docker compose logs --no-color migrate | grep 'All migrations have been successfully applied.'
      # The seed depends on migrate and the backend depends on the seed, both
      # with service_completed_successfully, so the seed starts after migrate
      # exits 0 and exits 0 itself before the backend starts. This step runs
      # before the seed re-run step, so ps finds exactly one seed container.
      - name: The seed ran once, after migrate and before the backend
        if: steps.changed.outputs.run == 'true'
        run: |
          docker compose ps -a seed
          migrate=$(docker compose ps -a -q migrate)
          seed=$(docker compose ps -a -q seed)
          backend=$(docker compose ps -a -q backend)
          state=$(docker inspect "$seed" --format '{{.State.Status}} {{.State.ExitCode}} {{.RestartCount}}')
          echo "seed status, exit code, restarts: $state"
          [ "$state" = "exited 0 0" ]
          migrate_finished=$(docker inspect "$migrate" --format '{{.State.FinishedAt}}')
          seed_started=$(docker inspect "$seed" --format '{{.State.StartedAt}}')
          seed_finished=$(docker inspect "$seed" --format '{{.State.FinishedAt}}')
          backend_started=$(docker inspect "$backend" --format '{{.State.StartedAt}}')
          echo "migrate finished $migrate_finished, seed started $seed_started, seed finished $seed_finished, backend started $backend_started"
          node -e '
            const [migrateFinished, seedStarted, seedFinished, backendStarted] = process.argv.slice(1).map(Date.parse);
            console.log(`first seed took ${((seedFinished - seedStarted) / 1000).toFixed(1)} s`);
            process.exit(migrateFinished < seedStarted && seedFinished < backendStarted ? 0 : 1);
          ' "$migrate_finished" "$seed_started" "$seed_finished" "$backend_started"
          docker compose logs --no-color seed | grep 'SRD seed complete.'
      - name: Probe the running stack
        if: steps.changed.outputs.run == 'true'
        run: |
          docker compose ps
          # Only the frontend publishes a port, so this request goes through the
          # frontend container's /api proxy to the backend. The port binds
          # 127.0.0.1 only. Every probe names that address, because an
          # IPv6-first resolver could send localhost to ::1 and miss it.
          body=$(curl -fsS http://127.0.0.1:3000/api/health)
          echo "GET /api/health -> $body"
          echo "$body" | grep -q '"status":"ok"'
          # / redirects to /login through the middleware; probe /login directly.
          curl -fsS -o /dev/null http://127.0.0.1:3000/login
      # The seed filled the SRD tables. Spells come from the extracted JSON, so
      # an image without docs/extracted-srd-json fails here, and classes come
      # from the hand-authored data. The server image sets NODE_ENV=production,
      # so the seed never creates the dev admin. The admin login sends its own
      # X-Forwarded-For, so it lands in a rate-limit bucket that the rate
      # limiter step below never uses.
      - name: The seed loaded the SRD and created no dev admin
        if: steps.changed.outputs.run == 'true'
        run: |
          spells=$(curl -fsS http://127.0.0.1:3000/api/srd/spells | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).total)')
          monsters=$(curl -fsS http://127.0.0.1:3000/api/srd/monsters | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).total)')
          classes=$(curl -fsS http://127.0.0.1:3000/api/srd/classes | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).length)')
          echo "spells=$spells monsters=$monsters classes=$classes"
          [ "$spells" -gt 0 ]
          [ "$monsters" -gt 0 ]
          [ "$classes" -gt 0 ]
          admins=$(docker compose exec -T postgres psql -U grimoire -d grimoire_os -At -c "SELECT count(*) FROM users WHERE username = 'admin'")
          echo "admin users: $admins"
          [ "$admins" = "0" ]
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H 'X-Forwarded-For: 203.0.113.20' \
            -d '{"username":"admin","password":"admin"}' \
            http://127.0.0.1:3000/api/auth/login)
          echo "admin/admin login -> $code"
          [ "$code" = "401" ]
      # The image sets NODE_ENV=production and this job leaves COOKIE_SECURE
      # unset, so every login cookie must carry Secure. cookie-flags.sh prints the
      # Set-Cookie lines a fresh login returns and how many of them are Secure.
      # Register and login go through the frontend container's /api proxy, so
      # the counts also prove Set-Cookie survives the proxy.
      - name: Login cookies carry Secure by default
        if: steps.changed.outputs.run == 'true'
        run: |
          cat > "$RUNNER_TEMP/cookie-flags.sh" <<'SH'
          login() {
            curl -fsS -D - -o /dev/null -X POST -H 'Content-Type: application/json' \
              -d '{"username":"ci-cookie","password":"CiCookie-Pass1!"}' \
              http://127.0.0.1:3000/api/auth/login | tr -d '\r'
          }
          cookies=$(login | grep -i '^set-cookie:')
          echo "$cookies"
          total=$(echo "$cookies" | grep -c .)
          secure=$(echo "$cookies" | grep -Eic '; *secure(;|$)' || true)
          echo "set-cookie=$total secure=$secure"
          SH
          curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"username":"ci-cookie","password":"CiCookie-Pass1!"}' \
            http://127.0.0.1:3000/api/auth/register
          docker compose logs backend | grep 'Auth cookies carry the Secure flag (COOKIE_SECURE unset, NODE_ENV=production)'
          result=$(bash "$RUNNER_TEMP/cookie-flags.sh" | tee /dev/stderr | tail -1)
          [ "$result" = "set-cookie=4 secure=4" ]
      # The backend logs one line per request, and none for the healthcheck,
      # which has polled /api/health every 10 s since the boot. The startup route
      # table names /api/health too, so the check matches a request line, the
      # method then the path then the status. It runs before the COOKIE_SECURE
      # step, because recreating the backend empties its log.
      - name: Backend logs request lines and none for the healthcheck
        if: steps.changed.outputs.run == 'true'
        run: |
          logs=$(docker compose logs --no-color backend)
          grep -E 'POST /api/auth/login 200 [0-9]+ms' <<<"$logs"
          if grep -E '(GET|HEAD) /api/health [0-9]{3} ' <<<"$logs"; then
            echo "::error::The backend logged a request line for /api/health."
            exit 1
          fi
      # Login allows 5 requests a minute per client key (LOGIN_LIMIT in
      # auth.controller.ts, and compose passes no THROTTLE_AUTH_LIMIT). The
      # key is the client address from X-Forwarded-For, so one forwarded
      # address hits 429 on its sixth login while a second address still gets
      # in. The step fails if TRUST_PROXY is off, if main.ts stops applying it,
      # or if Next stops forwarding the header, because every login would then
      # share one key and the last one would also get 429. The cookie step's
      # login sends no X-Forwarded-For, so Next fills in the address its
      # connection came from, and that login leaves both buckets here
      # untouched. The admin probe in the seed step sends 203.0.113.20, a third
      # key. The COOKIE_SECURE step recreates the backend, which empties the
      # in-memory throttler storage.
      - name: Rate limiter keys on the client address through the proxy
        if: steps.changed.outputs.run == 'true'
        run: |
          login() {
            curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -H "X-Forwarded-For: $1" \
              -d '{"username":"ci-cookie","password":"CiCookie-Pass1!"}' \
              http://127.0.0.1:3000/api/auth/login
          }
          codes=()
          for i in 1 2 3 4 5 6; do
            code=$(login 203.0.113.10)
            codes+=("$code")
            echo "203.0.113.10 login $i -> $code"
          done
          other=$(login 203.0.113.11)
          echo "203.0.113.11 login 1 -> $other"
          [ "${codes[0]}" = "200" ]
          [ "${codes[5]}" = "429" ]
          [ "$other" = "200" ]
      # The seed is safe to re-run on a seeded database, the way an operator
      # runs it by hand. run starts migrate again, which finds nothing pending,
      # and leaves the running backend alone. --rm removes the container, so
      # the step times the run itself. Row counts must not change.
      - name: A second seed leaves the row counts unchanged
        if: steps.changed.outputs.run == 'true'
        run: |
          counts() {
            docker compose exec -T postgres psql -U grimoire -d grimoire_os -At -c "
              SELECT 'spells', count(*) FROM spells
              UNION ALL SELECT 'monsters', count(*) FROM monsters
              UNION ALL SELECT 'items', count(*) FROM items
              UNION ALL SELECT 'srd_classes', count(*) FROM srd_classes
              UNION ALL SELECT 'class_features', count(*) FROM class_features
              UNION ALL SELECT 'subclasses', count(*) FROM subclasses
              UNION ALL SELECT 'subclass_features', count(*) FROM subclass_features"
          }
          backend=$(docker compose ps -q backend)
          backend_before=$(docker inspect "$backend" --format '{{.State.StartedAt}} {{.RestartCount}}')
          before=$(counts)
          start=$(date +%s%N)
          docker compose run --rm -T seed
          end=$(date +%s%N)
          echo "second seed took $(( (end - start) / 1000000 )) ms, migrate re-run included"
          after=$(counts)
          paste -d ' ' <(echo "$before") <(echo "$after")
          [ "$before" = "$after" ]
          backend_after=$(docker inspect "$backend" --format '{{.State.StartedAt}} {{.RestartCount}}')
          echo "backend started and restarts, before: $backend_before, after: $backend_after"
          [ "$backend_before" = "$backend_after" ]
      # Recreate only the backend with the override. The image is reused, and
      # the user registered above survives in the database.
      - name: COOKIE_SECURE=false drops Secure from login cookies
        if: steps.changed.outputs.run == 'true'
        run: |
          COOKIE_SECURE=false docker compose up -d --no-deps --wait --wait-timeout 180 backend
          docker compose logs backend | grep 'Auth cookies are sent without the Secure flag (COOKIE_SECURE=false)'
          result=$(bash "$RUNNER_TEMP/cookie-flags.sh" | tee /dev/stderr | tail -1)
          [ "$result" = "set-cookie=4 secure=0" ]
      - name: Show service logs
        if: failure() && steps.changed.outputs.run == 'true'
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Tear down
        if: always() && steps.changed.outputs.run == 'true'
        run: docker compose down -v --remove-orphans
