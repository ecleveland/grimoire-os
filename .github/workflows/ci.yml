name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install shared deps (prepare builds dist)
        working-directory: shared
        run: npm ci
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      # prettier.spec.ts in the backend suite runs `npm run format:check`
      # inside frontend/, so the frontend toolchain must be installed too.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Lint
        working-directory: backend
        run: npm run lint:check
      - name: Unit tests + coverage thresholds
        working-directory: backend
        run: npm run test:cov
      - name: Production build (nest build)
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            frontend/package-lock.json
      - name: Install shared deps (prepare builds dist)
        working-directory: shared
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests + coverage thresholds
        working-directory: frontend
        run: npm run test:cov
      - name: Production build (next build)
        working-directory: frontend
        run: npm run build

  scripts:
    name: SRD extraction lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/lib/*.test.mjs

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-e2e-secret
      E2E_DATABASE_URL: postgresql://grimoire:grimoire@localhost:5432/grimoire_os_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      # dev-e2e.sh waits on the backend port with `nc`, which is not
      # preinstalled on ubuntu-latest runners.
      - name: Install netcat
        run: sudo apt-get update -q && sudo apt-get install -y -q netcat-openbsd
      # dev-e2e.sh sources the repo-root .env (set -e: it must exist).
      - name: Create .env
        run: echo "JWT_SECRET=${JWT_SECRET}" > .env
      - name: Install shared deps (prepare builds dist)
        working-directory: shared
        run: npm ci
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Pre-provision the database before Playwright's webServer launches
      # dev-e2e.sh, so the cold-start work (image pull, migrate, seed) happens
      # in visible, individually-timed steps; dev-e2e.sh then re-runs the same
      # steps as fast idempotent no-ops.
      - name: Start postgres
        run: |
          docker compose up -d postgres
          until docker compose exec postgres pg_isready -U grimoire -d grimoire_os; do sleep 1; done
      - name: Provision E2E database
        run: |
          DB_EXISTS=$(docker compose exec -T postgres psql -U grimoire -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'grimoire_os_e2e'")
          if [ "$DB_EXISTS" != "1" ]; then
            docker compose exec -T postgres createdb -U grimoire grimoire_os_e2e
          fi
      - name: Migrate + seed E2E database
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: |
          npx prisma migrate deploy
          npm run seed
      - name: Run Playwright suite
        working-directory: e2e
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  docker:
    name: Docker images build (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config -q
      - name: Build images
        run: docker compose build
