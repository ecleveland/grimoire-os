services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # No host port. docker-compose.dev.yml publishes 5432 for dev.sh and the
    # e2e stack, which run the backend on the host.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-grimoire}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-grimoire_os}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Applies pending migrations once and exits. The backend starts only after it
  # exits 0, so a failed migration stops the stack with the error in
  # `docker compose logs migrate`, and nothing restarts in a loop.
  migrate:
    # The migrate target of the backend Dockerfile, which keeps the Prisma CLI.
    # The backend's own image leaves the CLI out and cannot migrate.
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    # Named per project, like the backend image, so the CI job can find both.
    image: ${COMPOSE_PROJECT_NAME}-migrate
    # The local CLI, never npx, which could fetch another version from npm.
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      # The same address the backend uses, built the same way.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-grimoire}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-grimoire_os}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Loads the SRD reference data once and exits. It starts after migrate exits 0,
  # and the backend starts only after it exits 0, so a failed seed stops the
  # stack with the error in `docker compose logs seed`, and nothing restarts in
  # a loop. The seed updates SRD rows in place, so it runs on every up.
  seed:
    # The backend's server image, which carries the compiled seed and the SRD
    # JSON. It sets NODE_ENV=production, so the seed skips the dev admin user.
    image: ${COMPOSE_PROJECT_NAME}-backend
    # The backend service builds this image. No registry has it, so a pull
    # would fail and stop `docker compose pull` before it reaches postgres.
    pull_policy: never
    command: ['node', 'dist/seed/run-seed.js']
    environment:
      # The same address the backend uses, built the same way.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-grimoire}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-grimoire_os}
      # The image sets this too. Repeated here so an image built without it
      # still never creates the admin/admin user. No JWT_SECRET, because the
      # seed reads only the database settings.
      - NODE_ENV=production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # The Dockerfile's last stage, the server without the Prisma CLI.
    image: ${COMPOSE_PROJECT_NAME}-backend
    # No host port. The frontend container is the backend's only client, and
    # it proxies the browser's /api requests here.
    environment:
      - PORT=3001
      # Built from the POSTGRES_* variables, never read as DATABASE_URL, because
      # the root .env sets DATABASE_URL, FRONTEND_URL and NEXT_PUBLIC_API_URL to
      # localhost values for dev.sh and compose reads that file too.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-grimoire}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-grimoire_os}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      # The CORS origin, the address users open in the browser.
      - FRONTEND_URL=${PUBLIC_URL:-http://localhost:3000}
      # The frontend proxy is one hop, so req.ip and the rate limiter see the
      # client address from X-Forwarded-For. Every request reaches the backend
      # from the frontend container, so 0 puts every client in one rate-limit
      # bucket.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Unset, the auth cookies carry the Secure flag because the image runs with
      # NODE_ENV=production. Set COOKIE_SECURE=false in .env to serve over plain
      # HTTP on a trusted network.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # Unset means log level and text lines. See .env.example.
      - LOG_LEVEL=${LOG_LEVEL:-}
      - LOG_FORMAT=${LOG_FORMAT:-}
      # The in-memory response cache. These defaults match the backend's own.
      # Never use the empty ${VAR:-} form here, because the backend parses
      # these with parseInt and falls back only when they are unset, so an
      # empty value would parse to NaN.
      - CACHE_TTL_MS=${CACHE_TTL_MS:-86400000}
      - CACHE_LRU_SIZE=${CACHE_LRU_SIZE:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    # The alpine image has node but no curl, so the probe uses node's fetch.
    # start_period covers the server's boot. Migrations and the seed finish
    # before it starts.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # The only published port, bound to 127.0.0.1 by default so only a reverse
    # proxy on the same host reaches it. The backend trusts one proxy hop, so a
    # client that reaches port 3000 directly can forge X-Forwarded-For and get a
    # fresh rate-limit key on every request. FRONTEND_BIND=0.0.0.0 opens the
    # port to the network.
    ports:
      - '${FRONTEND_BIND:-127.0.0.1}:3000:3000'
    environment:
      # The browser calls the relative /api on this container. The middleware
      # proxies those requests to INTERNAL_API_URL, which it reads on every
      # request, and server components fetch from the same address. It uses
      # the backend's service name on the compose network.
      - INTERNAL_API_URL=http://backend:3001/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
