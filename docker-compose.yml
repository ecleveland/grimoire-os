services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=grimoire
      - POSTGRES_PASSWORD=grimoire
      - POSTGRES_DB=grimoire_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'grimoire', '-d', 'grimoire_os']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://grimoire:grimoire@postgres:5432/grimoire_os
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    # The alpine image has node but no curl, so the probe uses node's fetch.
    # start_period covers `prisma migrate deploy`, which runs before the server.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - '3000:3000'
    environment:
      # Browser-facing API URL (baked into the client bundle at build).
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      # Server-side API URL for SSR data fetches (VEG-320). The frontend
      # container can't reach the backend via the host-published localhost URL —
      # it uses the compose service name on the internal network instead.
      - INTERNAL_API_URL=http://backend:3001/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
